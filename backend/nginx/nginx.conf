# Load balancer in front of two identical API processes running on the host
# (uvicorn on :8000 and :8001). Round-robin is nginx's default upstream
# strategy - no directive needed to turn it on.
#
# This works because the API is stateless (JWT auth, no server-side sessions) -
# any request can land on either instance with no session-affinity problem.

events {
    worker_connections 1024;
}

http {
    upstream urbanfurniture_api {
        server host.docker.internal:8000;
        server host.docker.internal:8001;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://urbanfurniture_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Which instance actually served this request - check this header on
            # two consecutive responses and see it alternate, proof round-robin
            # is real and not just claimed.
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
