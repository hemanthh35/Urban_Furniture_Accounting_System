services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urbanfurniture
      POSTGRES_PASSWORD: urbanfurniture
      POSTGRES_DB: urbanfurniture
    ports:
      - "5434:5432"
    volumes:
      - urbanfurniture_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanfurniture"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs the RQ job queue (Ledger Integrity Check, Bulk Invoice PDF Export).
  # Port 6380, not Redis's default 6379, so it doesn't clash with another
  # Redis already running on the same machine for a different project.
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reverse proxy round-robining across two uvicorn processes on the host
  # (see nginx/nginx.conf) - the API itself isn't containerized here, only the
  # load balancer in front of it.
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8020:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Scrapes /metrics off both uvicorn instances (see monitoring/prometheus.yml) -
  # same host.docker.internal trick as nginx, since those instances run directly
  # on the host, not as containers.
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - urbanfurniture_prometheus_data:/prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - urbanfurniture_grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  urbanfurniture_pgdata:
  urbanfurniture_prometheus_data:
  urbanfurniture_grafana_data:
