services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urbanfurniture
      POSTGRES_PASSWORD: urbanfurniture
      POSTGRES_DB: urbanfurniture
    ports:
      - "5434:5432"
    volumes:
      - urbanfurniture_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanfurniture"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  urbanfurniture_pgdata:
