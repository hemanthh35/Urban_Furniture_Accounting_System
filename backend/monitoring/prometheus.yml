global:
  scrape_interval: 10s

scrape_configs:
  - job_name: urbanfurniture-api
    metrics_path: /metrics
    static_configs:
      # The same two uvicorn instances nginx load-balances across (see
      # nginx/nginx.conf) - labeled separately so Grafana can show them apart,
      # which is also how you'd visually prove traffic really is split
      # between both instead of only ever landing on one.
      - targets: ["host.docker.internal:8000"]
        labels:
          instance_name: api1
      - targets: ["host.docker.internal:8001"]
        labels:
          instance_name: api2
